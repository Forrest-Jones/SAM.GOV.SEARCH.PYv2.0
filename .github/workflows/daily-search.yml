name: daily-search

on:
  schedule:
    # 12:00 UTC = 7:00 AM CT (6:00 AM CDT during daylight saving)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run opportunity search
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 find_opportunities.py

      - name: Commit updated state and drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.sqlite3 drafts/
          git diff --cached --quiet || git commit -m "chore: daily search $(date -u +%Y-%m-%d)"
          git push
