name: daily-search

on:
  schedule:
    # Target: 10:00 AM in Houston, every day, year-round.
    #
    # GitHub cron is UTC only and does not follow daylight saving, so a single
    # entry drifts by an hour twice a year. Both times below are fired, and the
    # gate step keeps only the one that is actually 10:00 in America/Chicago:
    #   15:00 UTC = 10:00 CDT (summer) / 09:00 CST (winter)
    #   16:00 UTC = 11:00 CDT (summer) / 10:00 CST (winter)
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Run only at 10:00 America/Chicago
        id: gate
        run: |
          hour=$(TZ=America/Chicago date +%H)
          echo "local hour in Houston: $hour"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "10" ]; then
            echo "not 10:00 local — this is the other DST cron, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'

      # Both businesses live on the same registration but the work has nothing
      # in common, so each profile is searched separately and gets its own
      # scoring, threshold, state file, drafts folder and email digest.
      - name: Search — Proverbs 1821 (tax / accounting / evaluation)
        if: steps.gate.outputs.skip != 'true'
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 find_opportunities.py --profile p1821 --always-email

      - name: Search — Ares Robotics (waste / remediation / machinery)
        # Runs even if the first profile failed, so one failing search can't
        # silently hide the other business's opportunities.
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 find_opportunities.py --profile ares --always-email

      # GitHub switches off a scheduled workflow after 60 days with no
      # repository activity. Nothing would break loudly — the searches would
      # just stop arriving. So every run appends one line to
      # .log/daily-search.log and commits it, which means there is always a
      # push within the last 24 hours and the 60-day clock never gets past 1.
      # The line doubles as a permanent record of every run.
      #
      # To switch the heartbeat off, set KEEPALIVE below to "off". The search
      # and the email still run; only the daily commit stops (and the 60-day
      # clock starts counting again).
      - name: Commit results and keep the schedule alive
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          KEEPALIVE: "on"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the real output first, so the heartbeat line can record
          # whether this run actually found anything.
          git add -A state-*.sqlite3 drafts/
          if git diff --cached --quiet; then
            results="no new notices"
          else
            results="new results"
          fi

          if [ "$KEEPALIVE" = "on" ]; then
            mkdir -p .log
            printf '%s  run %s  %s  %s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$GITHUB_RUN_NUMBER" "$GITHUB_EVENT_NAME" "$results" \
              >> .log/daily-search.log
            git add .log/daily-search.log
          fi

          if git diff --cached --quiet; then
            echo "nothing to commit — keepalive is off and there are no new results"
            exit 0
          fi

          git commit -m "chore: daily search $(date -u +%Y-%m-%d) - $results"
          # A search takes minutes, so main can move while it runs — a push
          # straight from the checked-out SHA then fails "fetch first" and the
          # results are lost. Rebase onto whatever landed meanwhile, and retry
          # in case something lands during the rebase itself.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push search results after 3 attempts" >&2
          exit 1
