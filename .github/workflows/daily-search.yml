name: daily-search

on:
  schedule:
    # Target: 10:00 AM in Houston, every day, year-round.
    #
    # GitHub cron is UTC only and does not follow daylight saving, so a single
    # entry drifts by an hour twice a year. Both times below are fired, and the
    # gate step keeps only the one that is actually 10:00 in America/Chicago:
    #   15:xx UTC = 10:xx CDT (summer) / 09:xx CST (winter)
    #   16:xx UTC = 11:xx CDT (summer) / 10:xx CST (winter)
    #
    # Whichever of the pair arrives first at or after 10:00 local does the
    # work; the other finds today's run already logged and stops. That also
    # absorbs a late delivery, which GitHub warns about and which already
    # cost one run.
    #
    # Minute 17, not 0, on purpose. GitHub's own docs name the start of every
    # hour as a high-load window where the schedule event gets delayed or
    # dropped, and a 15:00 entry is queued behind everyone else's :00 cron.
    # An odd minute off the hour is far more likely to fire on time, and the
    # gate below only looks at the hour, so 10:17 local is still "10:00".
    - cron: "17 15 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      # Checked out before the gate, because the gate needs to see whether
      # today's run already happened.
      - uses: actions/checkout@v4

      - name: Run once a day, at or after 10:00 America/Chicago
        id: gate
        run: |
          hour=$(TZ=America/Chicago date +%H)
          today=$(date -u +%Y-%m-%d)
          echo "local hour in Houston: $hour (UTC date $today)"

          # The first version of this gate demanded the local hour be
          # exactly 10, to keep only the correct half of the DST cron pair.
          # It worked, and then threw away the first scheduled run that ever
          # fired: GitHub delivered the event two hours late, local time was
          # 13:00, and the gate discarded it — turning a late run into no
          # run at all. GitHub states plainly that the schedule event can be
          # delayed, so a guard that only tolerates the exact minute is a
          # guard that fails on the platform's documented behaviour.
          #
          # Run-once-per-day is the property actually wanted. Too early and
          # the other cron of the pair will cover it; already run today and
          # there is nothing to do; otherwise go, however late it is.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$hour" -lt 10 ]; then
              echo "before 10:00 local — the later cron covers today"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ -f .log/daily-search.log ] && grep -q "^$today" .log/daily-search.log; then
              echo "already ran today — nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "first run of the day, at or after 10:00 local — going"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'

      # Both businesses live on the same registration but the work has nothing
      # in common, so each profile is searched separately and gets its own
      # scoring, threshold, state file, drafts folder and email digest.
      #
      # --batch N builds N submission-ready packet folders: the draft, a
      # price sheet carrying your rates, a cover email addressed to the
      # contracting officer, and the solicitation's own attachments. They
      # are committed below, so the day's tray is browsable on GitHub.
      #
      # --posted-days 90 rather than the default 45. Tax, accounting and
      # administrative-support RFQs are low volume, and a 45-day posting
      # window kept surfacing four or five candidates of which none fit.
      # The deadline filter still decides what is actually open, so a wider
      # posting window adds real candidates rather than stale ones, and
      # the search paginates, so nothing is silently truncated.
      #
      # Three a day, all of them Proverbs 1821, while the process is still
      # being learned. Ares gets none for now — not because its
      # opportunities matter less, but because company.toml has no legal
      # name, UEI, CAGE or address for it yet, so an Ares packet cannot be
      # submitted by anyone. Its search still runs and its digest still
      # arrives, so nothing is missed; only the paperwork waits. Once the
      # Ares registration is confirmed, move some of the three over.
      - name: Search — Proverbs 1821 (tax / accounting / evaluation)
        if: steps.gate.outputs.skip != 'true'
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 find_opportunities.py --profile p1821 --always-email --batch 3 --posted-days 90

      - name: Search — Ares Robotics (waste / remediation / machinery)
        # Runs even if the first profile failed, so one failing search can't
        # silently hide the other business's opportunities.
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 find_opportunities.py --profile ares --always-email --batch 0 --posted-days 90

      # GitHub switches off a scheduled workflow after 60 days with no
      # repository activity. Nothing would break loudly — the searches would
      # just stop arriving. So every run appends one line to
      # .log/daily-search.log and commits it, which means there is always a
      # push within the last 24 hours and the 60-day clock never gets past 1.
      # The line doubles as a permanent record of every run.
      #
      # To switch the heartbeat off, set KEEPALIVE below to "off". The search
      # and the email still run; only the daily commit stops (and the 60-day
      # clock starts counting again).
      # Authored as the owner, not as github-actions[bot], on purpose: the
      # contribution graph on a GitHub profile counts only commits whose
      # author email belongs to the account. Five days of bot-authored
      # heartbeats kept the schedule alive and painted nothing.
      - name: Commit results and keep the schedule alive
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          KEEPALIVE: "on"
        run: |
          git config user.name "Forrest Jones"
          git config user.email "forrestjones2010@gmail.com"

          # Stage the real output first, so the heartbeat line can record
          # whether this run actually found anything. Each path is checked
          # because this step runs even when a search failed: the shell is
          # `bash -e`, and `git add` on a path that does not exist yet
          # (no packets/ on the first run) would abort the whole step and
          # lose the heartbeat commit with it.
          for path in state-*.sqlite3 drafts packets; do
            [ -e "$path" ] && git add -A "$path"
          done
          if git diff --cached --quiet; then
            results="no new notices"
          else
            results="new results"
          fi

          if [ "$KEEPALIVE" = "on" ]; then
            mkdir -p .log
            printf '%s  run %s  %s  %s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$GITHUB_RUN_NUMBER" "$GITHUB_EVENT_NAME" "$results" \
              >> .log/daily-search.log
            git add .log/daily-search.log
          fi

          if git diff --cached --quiet; then
            echo "nothing to commit — keepalive is off and there are no new results"
            exit 0
          fi

          git commit -m "chore: daily search $(date -u +%Y-%m-%d) - $results"
          # A search takes minutes, so main can move while it runs — a push
          # straight from the checked-out SHA then fails "fetch first" and the
          # results are lost. Rebase onto whatever landed meanwhile, and retry
          # in case something lands during the rebase itself.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push search results after 3 attempts" >&2
          exit 1
