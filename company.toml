# =====================================================================
# company.toml — the fact bank
#
# Fill this in ONCE. Every proposal packet reads from here, so a fact
# entered today is a fact filled automatically on every bid from now on.
# Anything left blank shows up as a visible [[FILL: ...]] in the packet —
# nothing is ever guessed or invented on a federal submission.
#
# Check what is still missing at any time:
#     python3 company.py
#
# This repository is PRIVATE. If that ever changes, or you add
# collaborators, remember that past-performance reference phone numbers
# and emails below become visible to everyone with repo access.
# =====================================================================

[shared]
# The person with authority to sign a binding offer. On a federal
# response this must be a real person who can obligate the company.
signatory_name  = "Forrest Andrew Jones"
signatory_title = "Owner / Managing Member"
phone           = "(832) 562-1355"
email           = "forrestjones2010@gmail.com"

# Kept current so packets can state it rather than leaving a blank.
sam_registration_expires = ""     # e.g. "2027-07-07"

# Insurance and bonding get asked for constantly. Enter once.
insurance_carrier       = ""
insurance_gl_limit      = ""      # e.g. "$2,000,000 general aggregate"
workers_comp            = ""      # e.g. "Statutory, TX"
bonding_capacity_single = ""      # leave blank if you do not bond
bonding_capacity_total  = ""

# Work the conveyor belt should never build a packet for, no matter how
# well it scores. This is the brake: add a PSC or a phrase the first time
# a packet shows up for work you do not actually perform, and it will
# never appear again.
skip_psc      = []                # e.g. ["Z2AZ", "Y1AZ"]
skip_keywords = []                # e.g. ["foundation repair", "roofing"]

# =====================================================================
# Proverbs 1821 — tax, accounting, audit, evaluation
# =====================================================================
[p1821]
legal_name = "Proverbs 1821 Consulting LLC"
uei        = "GD83PAK36818"       # 12 characters, from your SAM.gov registration
cage       = "22ND2"              # 5 characters
address    = "12103 Hawthorne Dr, Montgomery, TX 77356"

# 2-3 sentences. This is dropped into every cover letter, so write it
# once, well: what you do, for whom, and why a contracting officer
# should believe you can do it.
capability_statement = ""

# Which of your registered NAICS codes should get a bid packet built.
#
# The search still covers every code on your registration and the digest
# still shows you everything — this only decides where the conveyor belt
# spends effort. It exists because a registration is broader than a
# capability: 541620 surfaced a confined-space assessment needing
# OSHA/NFPA-trained crews, and 541720 surfaced an Army history office BPA
# wanting archival finding aids and exhibit samples. Both real, both
# biddable, neither one this firm's work.
#
# Leave the list empty to build packets for every code.
#
# The companion filter is packet_psc_prefixes below, and it does more work
# than this one: NAICS says what industry the buyer filed under, PSC says
# what is actually being bought.
packet_naics = [
  "541211",   # CPA offices — note: much of this needs a CPA licence
  "541213",   # tax preparation
  "541219",   # other accounting services
  "541611",   # administrative & general management consulting
  "541612",   # HR consulting
  "541613",   # marketing consulting
  "541614",   # process, physical distribution & logistics consulting
  "541618",   # other management consulting
  "541690",   # other scientific & technical consulting
  "541990",   # all other professional, scientific & technical services
]

# Which Product Service Code families should get a bid packet.
#
# Sharper than NAICS. A gas leak survey at Luke Air Force Base — hoses,
# gauges, underground leak detection per 49 CFR 192 — came through coded
# NAICS 541990, the "all other professional services" junk drawer, and
# would have been prepared as a bid. Its PSC was H999: inspection.
#
#   R = support services (R704 audit, R710 financial, R499 other)
#   B = special studies and analysis (B505, B521)
#   H = quality control and inspection      <- field work
#   J = maintenance and repair              <- field work
#   Y, Z = construction                     <- field work
#   F = natural resources and conservation  <- field work
#
# Empty means every PSC is fair game.
packet_psc_prefixes = ["R", "B"]

# Credentials the business actually holds. These answer the pass/fail
# qualification questions a solicitation asks, so each packet can resolve
# them itself instead of asking you every time.
#
# This block sits below every plain key of [p1821] on purpose: in TOML,
# the first [[p1821.xxx]] array-of-tables ends the parent table, so any
# bare key written after it silently belongs to the sub-table instead.
#
# kind must be one of: cpa, ea, pe, clearance, state_license, osha_nfpa,
# iso_assessor, other_cert. The mapping is strict on purpose — an Enrolled
# Agent does NOT answer a "licensed CPA" requirement. EA is an IRS
# credential under Circular 230 with unlimited representation rights
# before the IRS; audits and any opinion on financial statements are
# reserved to CPAs licensed by a state board of accountancy.
[[p1821.credentials]]
kind       = "ea"
holder     = "Randy White"
identifier = ""            # EA enrollment number, if you want it cited
expires    = ""            # renewal cycle date, if you track it

# ONLY real, verifiable contracts. A plausible-sounding invented
# reference is a false statement on a federal submission.
[[p1821.past_performance]]
customer     = ""
contract     = ""
value        = ""
period       = ""
scope        = ""
ref_name     = ""
ref_phone    = ""
ref_email    = ""

# Your standard labor categories and rates. These pre-fill the price
# sheet so the only thing left per bid is HOURS.
[[p1821.rate_card]]
category = ""
unit     = "hr"
rate     = ""

