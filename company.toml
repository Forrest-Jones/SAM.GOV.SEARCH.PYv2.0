# 2-3 sentences. This is dropped into every cover letter, so write it
# once, well: what you do, for whom, and why a contracting officer
# should believe you can do it.
past_performance_note = """Proverbs 1821 Consulting LLC has no federal past performance to report. The firm was formed in February 2026 and its relevant experience to date is commercial financial and administrative support, described above. We are responding to this Sources Sought Notice to register capability and interest, and to be considered as a subcontractor or named team member by primes preparing to compete this requirement. We are not representing ourselves as ready to prime it."""

capability_statement = """Proverbs 1821 Consulting LLC provides financial management, analysis, and administrative support services to organizations whose reporting and compliance obligations outrun their internal staffing. The core of the work is recurring financial operations: budget preparation and execution tracking, variance and burn-rate analysis, reconciliation, funding-document control, recurring management and stakeholder reporting, and the preparation of decision-support materials for executives who have to defend a number in front of a board, a lender, or an oversight body. The firm also supplies administrative and executive staff support around that work — document control, records management, calendar and correspondence support, meeting preparation and minutes, and action-item tracking — because in practice the financial deliverable and the staff work that surrounds it are the same job.

The firm is principal-led. Work is performed by Forrest A. Jones, who brings twenty-five years in capital markets and corporate finance, a Certified Healthcare Financial Professional designation, an active IRS PTIN, and formal software engineering training, and who scales the firm by contracting named specialists under written agreements rather than by staffing junior labor against senior rates. That structure matters to a customer buying financial and administrative support: the person analyzing the budget is the person briefing it, and the firm's fixed overhead does not get billed into the rate. A second element of how the firm works is automation. The principal builds the reporting infrastructure himself — API integrations, recurring report generation, pipeline and exception monitoring — so that status reporting that is normally hand-assembled every cycle is produced on a schedule and audited rather than rebuilt.

Proverbs 1821 is a young company registered and positioned for federal work: SAM registration is active, the firm carries a CAGE code, and it is currently pursuing its first federal award. It is not an incumbent on this or any comparable requirement, and it is not in a position to claim a federal past performance record it does not have."""

# Which of your registered NAICS codes should get a bid packet built.
#
# The search still covers every code on your registration and the digest
# still shows you everything — this only decides where the conveyor belt
# spends effort. It exists because a registration is broader than a
# capability: 541620 surfaced a confined-space assessment needing
# OSHA/NFPA-trained crews, and 541720 surfaced an Army history office BPA
# wanting archival finding aids and exhibit samples. Both real, both
# biddable, neither one this firm's work.
#
# Leave the list empty to build packets for every code.
#
# The companion filter is packet_psc_prefixes below, and it does more work
# than this one: NAICS says what industry the buyer filed under, PSC says
# what is actually being bought.
packet_naics = [
  "541211",   # CPA offices — note: much of this needs a CPA licence
  "541213",   # tax preparation
  "541219",   # other accounting services
  "541611",   # administrative & general management consulting
  "541612",   # HR consulting
  "541613",   # marketing consulting
  "541614",   # process, physical distribution & logistics consulting
  "541618",   # other management consulting
  "541690",   # other scientific & technical consulting
  "541990",   # all other professional, scientific & technical services
  # Construction trades — Jason Teal, general contractor, in-house.
  "236220", "236118",
  "238110", "238120", "238130", "238140", "238160", "238170", "238190",
  "238210", "238220", "238290", "238310", "238320", "238330", "238350",
  "238390", "238910", "238990",
  "811310",   # machinery repair — welding and fabrication
]

# Which Product Service Code families should get a bid packet.
#
# Sharper than NAICS. A gas leak survey at Luke Air Force Base — hoses,
# gauges, underground leak detection per 49 CFR 192 — came through coded
# NAICS 541990, the "all other professional services" junk drawer, and
# would have been prepared as a bid. Its PSC was H999: inspection.
#
#   R = support services (R704 audit, R710 financial, R499 other)
#   B = special studies and analysis (B505, B521)
#   H = quality control and inspection      <- field work
#   J = maintenance and repair              <- field work
#   Y, Z = construction                     <- field work
#   F = natural resources and conservation  <- field work
#
# Empty means every PSC is fair game.
packet_psc_prefixes = ["R", "B", "Y", "Z", "J"]   # Y, Z construction; J repair (welding)

# Credentials the business actually holds. These answer the pass/fail
# qualification questions a solicitation asks, so each packet can resolve
# them itself instead of asking you every time.
#
# This block sits below every plain key of [p1821] on purpose: in TOML,
# the first [[p1821.xxx]] array-of-tables ends the parent table, so any
# bare key written after it silently belongs to the sub-table instead.
#
# kind must be one of: cpa, ea, pe, clearance, state_license, osha_nfpa,
# iso_assessor, other_cert. The mapping is strict on purpose — an Enrolled
# Agent does NOT answer a "licensed CPA" requirement. EA is an IRS
# credential under Circular 230 with unlimited representation rights
# before the IRS; audits and any opinion on financial statements are
# reserved to CPAs licensed by a state board of accountancy.
# Affiliated organisations. Cited as affiliations and teaming resources,
# never as this firm's own past performance.
[[p1821.affiliations]]
name    = "Blackwater Evaluation (Blackwater Investment Group, Inc.)"
what    = "Third-party program evaluation practice serving federal research sponsors. Forrest A. Jones is Chief Investment Officer of the parent."
cite_as = "affiliation and teaming resource"

# Who performs the work. Individual experience belongs to the firm that
# employs the individual, so these go in a key personnel section without
# qualification — unlike another entity's contract history, which stays
# attributed to that entity.
